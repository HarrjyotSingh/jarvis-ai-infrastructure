services:
  chroma:
    image: chromadb/chroma:1.5.3
    volumes:
      - chroma-data:/data
    networks:
      - index
    restart: unless-stopped

  chroma-access:
    image: nginx:1.28-alpine
    depends_on:
      - chroma
    ports:
      - "127.0.0.1:${CHROMA_PROXY_PORT:-8000}:8000"
    volumes:
      - ./chroma-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - index
      - edge
    mem_limit: 64m
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.8
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    secrets:
      - n8n_encryption_key
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - index
      - edge
    mem_limit: 1280m
    restart: unless-stopped

networks:
  index:
    internal: true
  edge:

volumes:
  chroma-data:
  n8n-data:

secrets:
  n8n_encryption_key:
    file: ${N8N_KEY_FILE:-./.secrets/n8n-encryption-key}
